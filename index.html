function renderStage(){
  const body = $('#stageBody');
  if (!body) return;
  const studs = visibleStudents();
  const prevBtn = $('#stage [data-act="prev"]'), nextBtn = $('#stage [data-act="next"]');
  prevBtn.hidden = nextBtn.hidden = showMode === 'all';

  if (showMode === 'all'){
    $('#stagePos').textContent = '';
    const areas = visibleAreas();
    const multiClass = !sel.cls;
    const blocks = blocksOf(areas);
    const two = blocks.some(b => b.group);
    const rs = two ? ' rowspan="2"' : '';
    let h = `<h2 class="show-title">${esc(selLabel())} 점수 <span class="show-term">${esc(termLabel(currentTerm))}</span></h2><table class="show-table"><thead><tr>${multiClass ? `<th${rs}>반</th>` : ''}<th${rs}>번호</th><th class="l"${rs}>이름</th>`;
    let row2 = '';
    blocks.forEach(b => {
      if (!b.group){ b.areas.forEach(a => h += `<th${rs}>${esc(a.name)}</th>`); return; }
      h += `<th class="grp-th" colspan="${b.areas.length + 1}">${esc(b.group)}</th>`;
      b.areas.forEach(a => row2 += `<th class="in-grp">${esc(a.name)}</th>`);
      row2 += `<th class="sub-col">소계</th>`;
    });
    h += `<th${rs}>합계</th></tr>${two ? `<tr>${row2}</tr>` : ''}</thead><tbody>`;
    studs.forEach(s => {
      h += `<tr>${multiClass ? `<td>${esc(sel.grade ? s.cls : s.grade + '-' + s.cls)}</td>` : ''}<td>${esc(s.no)}</td><td class="l">${esc(s.name)}</td>`;
      blocks.forEach(b => {
        b.areas.forEach(a => {
          if (!applies(a, s)){ h += `<td class="n-a">·</td>`; return; }
          const rv = rawOf(s, a, false), sc = scoreFor(a, rv); h += `<td${rv === ABS ? ' class="abs-td"' : ''}>${rv === ABS ? '결시' : sc === null ? '–' : fmt(sc)}</td>`;
        });
        if (b.group){ const gs = groupScore(s, b.areas, false); h += `<td class="sub-col">${gs === null ? '–' : fmt(gs)}</td>`; }
      });
      const t = studentTotal(s, false);
      h += `<td class="tot">${t === null ? '–' : fmt(t)}</td></tr>`;
    });
    h += `</tbody></table>`;
    body.innerHTML = h;
  } else {
    const s = studs[showIdx];
    $('#stagePos').textContent = `${showIdx + 1} / ${studs.length}`;
    const mt = maxTotalFor(s);
    const tileOf = a => {
      const v = raws.get(s.key + '|' + a.id);
      const sc = scoreFor(a, v ?? '');
      const mx = maxFor(a);
      const subs = [];
      if (v === undefined || v === '') subs.push('아직 입력 전');
      else if (v === MISS) subs.push('미제출');
      else if (v === ABS) subs.push('결시');
      else if (areaType(a) === 'min') subs.push(`${esc(fmt(v))}${esc(a.unit)}`);
      else if (areaType(a) === 'deduct') subs.push(Number(v) ? `${esc(fmt(v))}${esc(a.unit || '개')} 틀림` : '모두 맞음');
      else if (areaType(a) === 'items') subs.push(`${itemBits(a, v).filter(Boolean).length}/${a.items.length}개 항목`);
      if (mx !== null) subs.push(`만점 ${fmt(mx)}점`);
      const pct = (sc !== null && mx) ? Math.max(0, Math.min(100, sc / mx * 100)) : 0;
      return `<div class="tile${v === MISS ? ' missing' : ''}${v === ABS ? ' absent' : ''}">
        <div class="t-name">${esc(a.name)}</div>
        <div class="t-score${sc === null ? ' none' : ''}">${sc === null ? '–' : fmt(sc)}${sc === null ? '' : '<small>점</small>'}</div>
        ${mx !== null ? `<div class="t-bar"><i style="width:${pct}%"></i></div>` : ''}
        <div class="t-sub">${subs.join(' · ')}</div>
        ${areaType(a) === 'items' && isItemsRaw(v) ? `<div class="t-items">${(() => { const bits = itemBits(a, v); return a.items.map((nm, bi) => `<span class="${bits[bi] ? 'ok' : ''}">${bits[bi] ? '✓ ' : ''}${esc(nm)}</span>`).join(''); })()}</div>` : ''}
      </div>`;
    };
    const tiles = blocksOf(data.areas.filter(a => applies(a, s))).map(b => {
      if (!b.group) return b.areas.map(tileOf).join('');
      const gs = groupScore(s, b.areas, false), gm = groupMax(b.areas, s);
      const pct = (gs !== null && gm) ? Math.max(0, Math.min(100, gs / gm * 100)) : 0;
      return `<div class="grp-card" style="--n:${b.areas.length}">
        <div class="grp-head">
          <span class="grp-name">${esc(b.group)}</span>
          <span class="grp-score${gs === null ? ' none' : ''}">${gs === null ? '–' : fmt(gs)}<small>${gm !== null ? ` / ${fmt(gm)}점` : '점'}</small></span>
        </div>
        ${gm !== null ? `<div class="t-bar grp-bar"><i style="width:${pct}%"></i></div>` : ''}
        <div class="grp-tiles">${b.areas.map(tileOf).join('')}</div>
      </div>`;
    }).join('');
    const t = studentTotal(s, false);
    body.innerHTML = `<div class="who"><span class="who-no">${esc(s.grade)}학년 ${esc(s.cls)}반 ${esc(s.no)}번</span><span class="who-name">${esc(s.name)}</span>
        <span class="spacer"></span>
        <span class="who-total"><span>총점</span><b>${t === null ? '–' : fmt(t)}</b><small>${mt !== null ? `/ ${fmt(mt)}점` : '점'}</small></span></div>
      <div class="tiles">${tiles}</div>`;
    const selEl = $('#showSel'); if (selEl) selEl.value = showIdx;
  }
  body.style.animation = 'none'; void body.offsetWidth; body.style.animation = '';
  fitStage();
}

function fitStage(){
  const st = $('#stage'), body = $('#stageBody');
  if (!st || !body || (st.offsetParent === null && !document.fullscreenElement)) return;
  // 화면 아래 끝까지만 차지하도록 높이를 맞춤 (전체 화면일 때는 100vh)
  if (!document.fullscreenElement){
    const top = st.getBoundingClientRect().top + window.scrollY;
    st.style.height = Math.max(360, window.innerHeight - top - 24) + 'px';
  } else st.style.height = '';
  const cs = getComputedStyle(st);
  const availH = st.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const availW = st.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const fits = z => { body.style.zoom = z; body.style.width = (availW / z) + 'px'; return body.getBoundingClientRect().height <= availH + 1; };
  // 들어가는 가장 큰 크기를 이분 탐색
  const best = minZ => {
    if (fits(1)) return 1;
    let lo = minZ, hi = 1;
    for (let k = 0; k < 9; k++){ const mid = (lo + hi) / 2; if (fits(mid)) lo = mid; else hi = mid; }
    return lo;
  };
  if (showMode === 'all'){
    // 표는 글씨가 너무 작아지지 않게 60%까지만 줄이고, 그래도 넘치면 안에서 스크롤
    const z = best(0.6); fits(z);
    st.classList.toggle('scroll', !fits(z));
    return;
  }
  st.classList.remove('scroll');
  // 묶음 카드를 나란히 / 한 줄에 하나씩 두 가지로 놓아 보고 더 크게 보이는 쪽을 고름
  body.classList.remove('stack');
  const zRow = best(0.4);
  body.classList.add('stack');
  const zStack = best(0.4);
  if (zRow >= zStack){ body.classList.remove('stack'); fits(zRow); } else fits(zStack);
}
window.addEventListener('resize', () => { if (currentTab === 'show') fitStage(); });
document.addEventListener('fullscreenchange', () => setTimeout(fitStage, 60));

function toggleFs(){
  const st = $('#stage');
  if (!st) return;
  if (document.fullscreenElement) document.exitFullscreen();
  else if (st.requestFullscreen) st.requestFullscreen().catch(() => toast('전체 화면을 열 수 없어요', 'err'));
}

const showEl = $('#tab-show');
showEl.addEventListener('click', e => {
  const m = e.target.closest('[data-mode]');
  if (m){ showMode = m.dataset.mode; $$('.seg button', showEl).forEach(b => b.classList.toggle('on', b === m)); $('#showSel').hidden = showMode === 'all'; renderStage(); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'prev') moveShow(-1);
  if (b.dataset.act === 'next') moveShow(1);
  if (b.dataset.act === 'fs') toggleFs();
});
showEl.addEventListener('change', e => { if (e.target.id === 'showSel'){ showIdx = +e.target.value; renderStage(); } });
document.addEventListener('keydown', e => {
  if (currentTab !== 'show') return;
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); moveShow(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp'){ e.preventDefault(); moveShow(-1); }
  else if (e.key === 'f' || e.key === 'F' || e.key === 'ㄹ'){ toggleFs(); }
});

/* ================= 설정 ================= */
const dlg = $('#settings');
function openSettings(){
  $('#cfgUrl').value = cfg.url || ''; $('#cfgPw').value = cfg.pw || ''; $('#cfgErr').textContent = '';
  dlg.showModal();
}
$('#settingsBtn').onclick = openSettings;
$('#cfgClose').onclick = () => dlg.close();
$('#reloadBtn').onclick = () => {
  if ((pending.size || draftDirty || stuDirty) && !confirm('저장하지 않은 변경이 사라져요. 다시 불러올까요?')) return;
  reload();
};
$('#demoBtn').onclick = () => { currentTerm = ''; cfg = { demo: true }; store(CFG_KEY, cfg); sel = null; dlg.close(); reload(); toast('데모 모드예요. 이 브라우저에만 저장됩니다.'); };
$('#cfgSave').onclick = async () => {
  const url = $('#cfgUrl').value.trim(), pw = $('#cfgPw').value;
  if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)){ $('#cfgErr').textContent = '주소는 https://script.google.com/ 으로 시작해서 /exec 로 끝나야 해요.'; return; }
  const prev = cfg;
  cfg = { url, pw, demo: false };
  if (prev.demo || prev.url !== url) currentTerm = '';
  $('#cfgErr').textContent = '연결 확인 중…';
  try {
    sel = null;
    applyData(await api('load'));
    store(CFG_KEY, cfg);
    pending.clear(); draftAreas = null; draftDirty = false; stuDirty = false;
    dlg.close(); $('#modeBadge').hidden = true; renderGroupSel(); renderCurrent(); toast('연결되었어요');
  } catch(e) { cfg = prev; $('#cfgErr').textContent = e.message; }
};

$$('.tab').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
window.addEventListener('beforeunload', e => { if (pending.size || draftDirty || stuDirty){ e.preventDefault(); e.returnValue = ''; } });

renderGroupSel(); renderTermSel();
if (cfg.url || cfg.demo) reload(); else { renderCurrent(); openSettings(); }
</script>
